# Builds the iOS app without a Mac and without signing: an unsigned .ipa as a job artifact, to be
# signed and installed with your own (free) Apple ID through Sideloadly or AltStore. Same steps as
# the `build:ios` job in .gitlab-ci.yml, on GitHub's hosted macOS runner instead of a self-hosted Mac.
name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    # The app's bundle id (com.domenic.opengym) lives in App.xcodeproj, not here: a free Apple ID
    # can't sign upstream's ch.duartesantos.opengym, and a PRODUCT_BUNDLE_IDENTIFIER passed to
    # xcodebuild would also land on every embedded framework, which iOS refuses to install.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Toolchain
        run: |
          xcodebuild -version
          pod --version

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Mobile web bundle + exercise media + `cap sync` (which runs `pod install` for ios/).
      - name: Build mobile bundle
        working-directory: frontend
        run: npm run build:mobile

      - name: Build app (unsigned)
        working-directory: frontend
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          # Build number = the Android versionCode, so both apps count the same way.
          BUILD="$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' android/app/build.gradle | sed -n 1p)"
          [ -n "$BUILD" ] || { echo "::error::could not read versionCode from android/app/build.gradle"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tee xcodebuild.log | grep -E "error:|warning: .*PrintPlugin|\*\* ARCHIVE" || true
          test -d build/App.xcarchive/Products/Applications/App.app || { tail -80 xcodebuild.log; exit 1; }

      - name: Package IPA
        working-directory: frontend/ios/App
        run: |
          set -euo pipefail
          # An .ipa is a zip with the .app under Payload/.
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          # Every bundle in the app must have its own id, or installing fails with DuplicateIdentifier.
          for p in Payload/App.app/Info.plist Payload/App.app/Frameworks/*/Info.plist; do
            echo "$(plutil -extract CFBundleIdentifier raw "$p")  ${p#Payload/App.app/}"
          done | tee ids.txt
          DUPES="$(cut -d' ' -f1 ids.txt | sort | uniq -d)"
          [ -z "$DUPES" ] || { echo "::error::duplicate bundle ids: $DUPES"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          zip -qr "$GITHUB_WORKSPACE/artifact/openGym-$VER-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/artifact"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: openGym-ipa
          path: artifact/*.ipa
          # Already a zip; compressing it again only costs time.
          compression-level: 0
